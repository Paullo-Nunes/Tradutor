<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10172a">
    <meta name="description" content="Traduza textos para vários idiomas com rapidez.">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
    <title>Tradutor | Tradução rápida</title>
</head>
<body>
    <main class="caixa-maior">
        <header class="cabecalho">
            <span class="etiqueta">TRADUÇÃO COM GOOGLE CLOUD</span>
            <h1>Que tal dizer de outro jeito?</h1>
            <p>Traduza seu texto do português para outro idioma.</p>
        </header>

        <form id="form-traducao">
            <label for="input-texto">Seu texto</label>
            <textarea id="input-texto" name="texto" maxlength="5000"
                placeholder="Digite o texto que deseja traduzir..." required></textarea>
            <div class="controles-texto">
                <span id="contador">0 / 5000</span>
                <button class="botao-voz" id="btn-voz" type="button" aria-label="Ditado por voz">
                    <img src="/assets/img/microfone.svg" alt="">
                    <span>Ditado</span>
                </button>
            </div>

            <div class="linha-controles">
                <div class="campo-idioma">
                    <label for="idioma">Traduzir para</label>
                    <select id="idioma" name="idioma">
                        <option value="en">Inglês</option>
                        <option value="es">Espanhol</option>
                        <option value="fr">Francês</option>
                        <option value="de">Alemão</option>
                        <option value="it">Italiano</option>
                        <option value="ja">Japonês</option>
                        <option value="ko">Coreano</option>
                        <option value="zh-CN">Chinês (simplificado)</option>
                        <option value="pt">Português</option>
                    </select>
                </div>
                <button class="botao-traduzir" id="btn-traduzir" type="submit">
                    <img src="/assets/img/traduzir.svg" alt="">
                    <span>Traduzir</span>
                </button>
            </div>
        </form>

        <section class="resultado" aria-labelledby="titulo-resultado">
            <div class="resultado-cabecalho">
                <h2 id="titulo-resultado">Tradução</h2>
                <button class="botao-copiar" id="btn-copiar" type="button" disabled>Copiar</button>
            </div>
            <p class="traducao" id="traducao" aria-live="polite">Sua tradução aparecerá aqui.</p>
            <p class="mensagem" id="mensagem" role="status"></p>
        </section>
        <p class="nota-privacidade">Seu texto é enviado ao Google Cloud Translation para ser traduzido.</p>
    </main>
</body>
</html>
